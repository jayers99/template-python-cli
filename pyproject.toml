[project]
name = "template-python-cli"
version = "0.1.0"
description = "A Python CLI project template following Praxis governance patterns."
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
]

[project.scripts]
template-cli = "template_python_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-bdd>=8.1.0",
    "ruff>=0.8.4",
    "mypy>=1.14.1",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_python_cli"]
